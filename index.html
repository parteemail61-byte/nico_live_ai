
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nico LIVE AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101018;color:#fff;font-family:Arial,sans-serif;padding:18px}
.container{max-width:520px;margin:auto}
header{text-align:center;margin-bottom:20px}
h1{color:#a78bfa;margin-bottom:5px}
.panel{background:#1c1c29;padding:18px;border-radius:16px;margin-bottom:15px}
.avatar{width:125px;height:125px;object-fit:cover;border-radius:50%;display:block;margin:10px auto;border:3px solid #a78bfa}
button{border:0;border-radius:10px;padding:13px;background:#8056e8;color:white;font-weight:bold;margin:4px;cursor:pointer}
button.secondary{background:#383849}
input{width:100%;padding:14px;border-radius:9px;border:1px solid #444;background:#101018;color:white;margin:7px 0}
#messages{height:220px;overflow:auto;background:#101018;padding:12px;border-radius:10px;margin:12px 0}
.msg{padding:8px;border-bottom:1px solid #333;line-height:1.4}
.status{text-align:center;color:#aaa;font-size:13px}
</style>
</head>
<body>
<div class="container">
<header>
<h1>🎙️ NICO LIVE AI</h1>
<div class="status" id="status">Conectando...</div>
</header>

<div class="panel">
<img class="avatar" src="/avatar" alt="Nico">
<h3 style="text-align:center">🔊 Voz do Nico</h3>
<p class="status">Voz masculina neural — Português Brasil</p>
<button onclick="testVoice()">TESTAR VOZ</button>
<button class="secondary" onclick="stopVoice()">PARAR VOZ</button>
<div class="status" id="voiceStatus">Voz Antonio Neural</div>
</div>

<div class="panel">
<h3>💬 Conversar com Nico</h3>
<input id="username" placeholder="Nome da pessoa" value="visitante">
<input id="message" placeholder="Digite uma mensagem">
<button onclick="sendMessage()">ENVIAR MENSAGEM</button>
<button class="secondary" onclick="clearChat()">LIMPAR</button>
<div id="messages">
<div class="msg">Sistema: Aguardando mensagens...</div>
</div>
</div>
</div>

<audio id="nicoAudio" playsinline></audio>

<script>
const audio = document.getElementById("nicoAudio");
let currentAudioUrl = null;

function addMessage(name,text){
 const box=document.getElementById("messages");
 const div=document.createElement("div");
 div.className="msg";
 div.textContent=name+": "+text;
 box.appendChild(div);
 box.scrollTop=box.scrollHeight;
}

async function speak(text){
 try{
  stopVoice();
  document.getElementById("voiceStatus").textContent="Gerando voz masculina...";
  const response=await fetch("/speak",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({text:text})
  });
  if(!response.ok){
   const err=await response.json();
   throw new Error(err.error||"Falha ao gerar áudio");
  }
  const blob=await response.blob();
  currentAudioUrl=URL.createObjectURL(blob);
  audio.src=currentAudioUrl;
  audio.onended=()=>{
   document.getElementById("voiceStatus").textContent="Voz pronta";
   if(currentAudioUrl){
    URL.revokeObjectURL(currentAudioUrl);
    currentAudioUrl=null;
   }
  };
  await audio.play();
  document.getElementById("voiceStatus").textContent="Nico está falando...";
 }catch(error){
  document.getElementById("voiceStatus").textContent="Erro: "+error.message;
  addMessage("Sistema",error.message);
 }
}

function stopVoice(){
 audio.pause();
 audio.currentTime=0;
 if(currentAudioUrl){
  URL.revokeObjectURL(currentAudioUrl);
  currentAudioUrl=null;
 }
 document.getElementById("voiceStatus").textContent="Voz parada";
}

function testVoice(){
 speak("Olá! Eu sou o Nico. Um abraço para todo mundo que está acompanhando a nossa live!");
}

async function sendMessage(){
 const message=document.getElementById("message").value.trim();
 const username=document.getElementById("username").value.trim()||"visitante";
 if(!message)return;
 document.getElementById("message").value="";
 addMessage(username,message);
 addMessage("Nico","Pensando...");
 try{
  const response=await fetch("/chat",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({message,username})
  });
  const data=await response.json();
  if(!response.ok)throw new Error(data.error||"Erro na conversa");
  const box=document.getElementById("messages");
  const last=box.lastElementChild;
  if(last && last.textContent==="Nico: Pensando...")last.remove();
  addMessage("Nico",data.reply);
  await speak(data.reply);
 }catch(error){
  addMessage("Sistema",error.message);
 }
}

function clearChat(){
 document.getElementById("messages").innerHTML="";
}

document.getElementById("message").addEventListener("keydown",e=>{
 if(e.key==="Enter")sendMessage();
});

fetch("/health")
.then(r=>r.json())
.then(data=>{
 document.getElementById("status").textContent=
 data.status==="ok"?"🟢 Sistema online":"Sistema indisponível";
})
.catch(()=>{
 document.getElementById("status").textContent="🔴 Erro de conexão";
});
</script>
</body>
</html>
